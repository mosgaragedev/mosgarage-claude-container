name: Build & Publish — mosgarage platform

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY:   docker.io
  SERVER_IMG: mosgarage/mosgarage
  WORKSPACE_IMG: mosgarage/workspace

jobs:
  # ── .NET build + test ──────────────────────────────────────────
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Restore
        run: dotnet restore Mosgarage.sln

      - name: Build
        run: dotnet build Mosgarage.sln -c Release --no-restore

      - name: Test
        run: dotnet test Mosgarage.sln -c Release --no-build --verbosity normal

  # ── Docker build + push ────────────────────────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: dotnet
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}   # mosgarage
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Meta — server image
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMG }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Meta — workspace image
        id: meta-workspace
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKSPACE_IMG }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context:    .
          target:     runtime
          platforms:  linux/amd64,linux/arm64
          push:       ${{ github.event_name != 'pull_request' }}
          tags:       ${{ steps.meta-server.outputs.tags }}
          labels:     ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push workspace image
        uses: docker/build-push-action@v5
        with:
          context:    .
          target:     workspace-base
          platforms:  linux/amd64,linux/arm64
          push:       ${{ github.event_name != 'pull_request' }}
          tags:       ${{ steps.meta-workspace.outputs.tags }}
          labels:     ${{ steps.meta-workspace.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## 🚀 mosgarage images published" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`mosgarage/mosgarage\` | ${{ steps.meta-server.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
          echo "| \`mosgarage/workspace\`  | ${{ steps.meta-workspace.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
