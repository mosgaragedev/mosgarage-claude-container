# ============================================================
# mosgaragedev/mosgaragedev — Docker Compose
# Usage:  docker compose up -d
#         docker compose logs -f
#         docker compose down
# ============================================================

services:
  mosgaragedev:
    image: docker.io/mosgaragedev/mosgaragedev:latest
    container_name: mosgaragedev
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # ── Port mapping ─────────────────────────────────────────
    ports:
      - "${CODE_SERVER_PORT:-8081}:8081"   # code-server  (VS Code)
      - "${NODE_SERVER_PORT:-3001}:3001"   # node-server  (HTTP + WS)
      - "${API_PORT:-4001}:4001"           # api-server   (REST)

    # ── Environment ──────────────────────────────────────────
    environment:
      CODE_SERVER_PASSWORD: ${CODE_SERVER_PASSWORD:-Password123.}
      CODE_SERVER_PORT:     ${CODE_SERVER_PORT:-8081}
      NODE_SERVER_PORT:     ${NODE_SERVER_PORT:-3001}
      API_PORT:             ${API_PORT:-4001}
      NODE_ENV:             ${NODE_ENV:-production}
      API_KEY:              ${API_KEY:-}        # leave blank = open

    # ── Volumes ──────────────────────────────────────────────
    volumes:
      - mosgaragedev-workspace:/app/workspace     # persistent workspace
      - mosgaragedev-code-server:/home/mosgaragedev/.code-server  # VS Code settings + extensions
      - mosgaragedev-logs:/var/log/mosgaragedev      # persistent logs

    # ── Health check ─────────────────────────────────────────
    healthcheck:
      test: |
        curl -sf http://localhost:3001/status &&
        curl -sf http://localhost:4001/api/v1/health
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

    # ── Resource limits ──────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 2g
          cpus:   "2.0"
        reservations:
          memory: 512m

    # ── Security ─────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true

    # ── Logging ──────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mosgaragedev-workspace:
    name: mosgaragedev-workspace
  mosgaragedev-code-server:
    name: mosgaragedev-code-server
  mosgaragedev-logs:
    name: mosgaragedev-logs
