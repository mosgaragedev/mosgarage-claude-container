[supervisord]
nodaemon=true
user=root
logfile=/var/log/mosgaragedev/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ── code-server (VS Code in browser) ─────────────────────────
[program:code-server]
command=code-server --config /home/mosgaragedev/.config/code-server/config.yaml /app/workspace
user=mosgaragedev
environment=HOME="/home/mosgaragedev",USER="mosgaragedev",PASSWORD="%(ENV_CODE_SERVER_PASSWORD)s"
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/var/log/mosgaragedev/code-server.log
stderr_logfile=/var/log/mosgaragedev/code-server.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── Node home server ──────────────────────────────────────────
[program:node-server]
command=node /app/server/index.js
user=mosgaragedev
environment=HOME="/home/mosgaragedev",USER="mosgaragedev",NODE_ENV="%(ENV_NODE_ENV)s",PORT="%(ENV_NODE_SERVER_PORT)s"
directory=/app/server
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/var/log/mosgaragedev/node-server.log
stderr_logfile=/var/log/mosgaragedev/node-server.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── Express API ───────────────────────────────────────────────
[program:api-server]
command=node /app/api/index.js
user=mosgaragedev
environment=HOME="/home/mosgaragedev",USER="mosgaragedev",NODE_ENV="%(ENV_NODE_ENV)s",PORT="%(ENV_API_PORT)s"
directory=/app/api
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/var/log/mosgaragedev/api-server.log
stderr_logfile=/var/log/mosgaragedev/api-server.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── Supervisor web UI (optional internal monitor) ────────────
[inet_http_server]
port=127.0.0.1:9001

[supervisorctl]
serverurl=http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
