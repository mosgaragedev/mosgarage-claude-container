version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.console.yml
# Console workstream — deploy independently of the full platform.
# Includes only what console needs: traefik, postgres, mosgaraged, control-plane.
#
# Usage:
#   docker compose -f docker-compose.console.yml up -d
#   ./startup.sh console
# ─────────────────────────────────────────────────────────────────────────────

networks:
  mosgarage-net:
    name: mosgarage-net

volumes:
  postgres-data:
  traefik-certs:
  mosgaraged-socket:

services:

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    networks: [mosgarage-net]
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-certs:/certs
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [mosgarage-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mosgarage
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosgaraged:
    image: mosgarage/mosgaraged:${PLATFORM_VERSION:-latest}
    restart: unless-stopped
    networks: [mosgarage-net]
    environment:
      MOSGARAGED_PORT: 9090
      CONTROL_PLANE_URL: http://control-plane:8080
      DAEMON_KEY: ${DAEMON_KEY}
      WORKSPACE_IDLE_MINUTES: ${WORKSPACE_IDLE_MINUTES:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mosgaraged-socket:/tmp
      - ./mosgarage.platform.yml:/platform/mosgarage.platform.yml:ro
      - ./VERSION:/platform/VERSION:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    image: mosgarage/control-plane:${PLATFORM_VERSION:-latest}
    restart: unless-stopped
    networks: [mosgarage-net]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=mosgarage;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      AzureAd__TenantId: ${AZURE_TENANT_ID}
      AzureAd__ClientId: ${AZURE_CLIENT_ID}
      AzureAd__ClientSecret: ${AZURE_CLIENT_SECRET}
      Console__Image: mosgarage/console:${PLATFORM_VERSION:-latest}
      Console__Domain: console.mosgarage.xyz
      Docker__Network: mosgarage-net
      Daemon__Url: http://mosgaraged:9090
      Daemon__Key: ${DAEMON_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mosgaraged-socket:/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s    # .NET cold start + EF migration
    depends_on:
      postgres:
        condition: service_healthy
      mosgaraged:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`api.mosgarage.xyz`)"
      traefik.http.routers.api.entrypoints: "websecure"
      traefik.http.routers.api.tls.certresolver: "letsencrypt"
      traefik.http.routers.api.middlewares: "entra-auth@file,secure-headers@file"
      traefik.http.services.api.loadbalancer.server.port: "8080"
      com.mosgarage.service: "control-plane"
