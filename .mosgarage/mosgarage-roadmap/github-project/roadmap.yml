# ─────────────────────────────────────────────────────────────────────────────
# mosgarage GitHub Project Board Definition
# Used by: scripts/setup-github-project.sh
# Creates: GitHub Project v2 board with all workstreams, milestones, issues
# ─────────────────────────────────────────────────────────────────────────────

project:
  title: "mosgarage Platform Roadmap"
  description: "Full platform build across all workstreams"
  org: mosgarage
  visibility: private

# ── Workstreams (GitHub Project custom fields / labels) ───────────────────────
workstreams:
  - id: WS-INFRA
    label: "🏗️ infrastructure"
    color: "0075ca"
    description: "Core platform infrastructure — Traefik, PostgreSQL, networking, TLS"

  - id: WS-DAEMON
    label: "⚙️ mosgaraged"
    color: "e4e669"
    description: "Node.js orchestration daemon — health, IPC, lifecycle, versioning"

  - id: WS-CONSOLE
    label: "💻 console"
    color: "d93f0b"
    description: "mosgarage.console — cloud IDE, DevPod, per-user workspaces, dashboard"

  - id: WS-STUDIO
    label: "🎨 studio"
    color: "0e8a16"
    description: "mosgarage.studio — blog, docs, FlipStack, content builder"

  - id: WS-COMMUNITY
    label: "🤝 community"
    color: "1d76db"
    description: "mosgarage.community — Discord bridge, profiles, forum, showcases"

  - id: WS-ACADEMY
    label: "🎓 academy"
    color: "5319e7"
    description: "mosgarage.academy — public courses and learning paths"

  - id: WS-ECAMPUS
    label: "🏫 ecampus"
    color: "b60205"
    description: "mosgarage.ecampus — internal org LMS"

  - id: WS-AGENT
    label: "🤖 agent"
    color: "006b75"
    description: "mosgarage.agent — AI layer across all services"

  - id: WS-DEVENV
    label: "🛠️ dev-environment"
    color: "f9d0c4"
    description: "Local dev setup — WSL, VS Code, Visual Studio, git sync, OneDrive"

  - id: WS-WINDOWS
    label: "🪟 windows-tooling"
    color: "c5def5"
    description: "Windows integrations — context menu, Planner, task automation"

  - id: WS-CICD
    label: "🚀 ci-cd"
    color: "bfd4f2"
    description: "CI/CD — GitHub Actions, versioning, multi-arch builds, deploy"

# ── Milestones ────────────────────────────────────────────────────────────────
milestones:
  - id: M1
    title: "v0.1 — Foundation"
    description: "Infrastructure, daemon, control plane, console MVP"
    due: "2025-08-01"

  - id: M2
    title: "v0.2 — Console GA"
    description: "Console dashboard, VS/VSCode autoload, workspace management"
    due: "2025-09-01"

  - id: M3
    title: "v0.3 — Studio"
    description: "Blog, docs, FlipStack standalone, content builder"
    due: "2025-10-01"

  - id: M4
    title: "v0.4 — Community + Academy"
    description: "Community portal, Discord bridge, Academy public courses"
    due: "2025-11-01"

  - id: M5
    title: "v0.5 — eCampus + Agent"
    description: "Internal LMS, AI layer across all services"
    due: "2025-12-01"

  - id: M6
    title: "v1.0 — Platform GA"
    description: "All services live, versioned, monitored, documented"
    due: "2026-01-01"

# ── Issues per workstream ─────────────────────────────────────────────────────
issues:

  # ── WS-INFRA ────────────────────────────────────────────────────────────────
  - title: "Set up Traefik v3 with wildcard TLS and forward auth middleware"
    workstream: WS-INFRA
    milestone: M1
    priority: critical
    labels: ["infrastructure", "traefik"]

  - title: "Configure PostgreSQL 16 with health checks and named volumes"
    workstream: WS-INFRA
    milestone: M1
    priority: critical
    labels: ["infrastructure", "database"]

  - title: "Define mosgarage.platform.yml service registry schema"
    workstream: WS-INFRA
    milestone: M1
    priority: high
    labels: ["infrastructure", "config"]

  - title: "Set up Docker networks and volume strategy"
    workstream: WS-INFRA
    milestone: M1
    priority: high
    labels: ["infrastructure", "docker"]

  - title: "Configure DNS wildcard records (*.mosgarage.xyz, *.console.mosgarage.xyz)"
    workstream: WS-INFRA
    milestone: M1
    priority: critical
    labels: ["infrastructure", "dns"]

  - title: "Entra ID OIDC app registration — covers all platform services"
    workstream: WS-INFRA
    milestone: M1
    priority: critical
    labels: ["infrastructure", "auth", "azure"]

  # ── WS-DAEMON ───────────────────────────────────────────────────────────────
  - title: "mosgaraged: service health polling loop"
    workstream: WS-DAEMON
    milestone: M1
    priority: high
    labels: ["mosgaraged", "health"]

  - title: "mosgaraged: Unix socket IPC bus"
    workstream: WS-DAEMON
    milestone: M1
    priority: high
